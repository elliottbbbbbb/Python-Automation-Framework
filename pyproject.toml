[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "osrsbot"
version = "0.1.0"
description = "OSRS automation toolkit with layered architecture for game automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elliott" }]
keywords = ["osrs", "automation", "bot", "runescape", "gaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pyautogui>=0.9.54",
  "PyWinCtl>=0.4; platform_system=='Windows'",
  "mouse>=0.7.1; platform_system=='Windows'",
  "keyboard>=0.13.5; platform_system=='Windows'",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "rich>=13.7.0",
  "interception-python>=1.13.6",
  "pyclick>=0.0.2",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "pyserial>=3.5",
  "pywin32>=306; platform_system=='Windows'",
  "python-dotenv>=1.0.0",
  "onnxruntime>=1.16.0",
  "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/yourusername/osrsbot"
Documentation = "https://github.com/yourusername/osrsbot#readme"

# Optional development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

# CLI command: `osrs-bot`
[project.scripts]
osrs-bot = "osrsbot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osrsbot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.autopep8]
max_line_length = 88
ignore = "E203,W503"
aggressive = 2