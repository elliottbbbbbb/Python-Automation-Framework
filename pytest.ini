[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --cov=src/osrsbot
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
markers =
    unit: Unit tests (fast, heavily mocked)
    integration: Integration tests (slower, less mocking)
    slow: Slow tests (skip with -m "not slow")
